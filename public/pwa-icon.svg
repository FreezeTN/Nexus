<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Gold Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Shield Base -->
  <path d="M 256 72 C 340 72 392 96 408 112 C 408 260 376 384 256 440 C 136 384 104 260 104 112 C 120 96 172 72 256 72 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)" />

  <!-- D20 Outline inside Shield -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top triangle -->
    <polygon points="256,150 200,210 312,210" fill="#b45309" fill-opacity="0.2" />
    <!-- Center triangle -->
    <polygon points="200,210 312,210 256,310" fill="#d97706" fill-opacity="0.3" />
    <!-- Outer d20 facets -->
    <polyline points="200,210 160,280 256,310" />
    <polyline points="312,210 352,280 256,310" />
    <polyline points="160,280 256,360 256,310" />
    <polyline points="352,280 256,360 256,310" />
    <polyline points="256,150 160,280" />
    <polyline points="256,150 352,280" />
  </g>

  <!-- "20" Text in Center -->
  <text x="256" y="272" font-family="serif" font-size="52" font-weight="bold" fill="#fef3c7" text-anchor="middle">20</text>
</svg>
