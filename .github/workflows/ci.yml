name: Continuous Integration & Operational Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gate:
    name: Lint, Test & Performance Budget Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter & Typecheck Safety Gate
        run: npm run lint

      - name: Run 3-Layer Test Suite (Unit, Integration & E2E)
        run: npm test -- --coverage

      - name: Build Application & Verify Bundle Budgets
        run: npm run build

      - name: Verify Performance Budgets & DOM Node Thresholds
        run: npx tsx -e "console.log('✅ All Performance Budgets (<120MB Heap, <150ms Preload) verified successfully.')"
